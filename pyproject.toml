[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mataklabat"
version = "0.1.0"
description = "Sistem peringatan dini karhutla Gunung Klabat (CV + LLM + AI Agent)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.optional-dependencies]
yolo = ["ultralytics"]

[project.scripts]
mataklabat = "mataklabat.__main__:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
