# Lokasi kamera HIPOTETIS (usulan titik pemasangan; belum ada kamera fisik).
# CAM-03 dan CAM-04 memakai koordinat desa dari OpenStreetMap; CAM-01 dan CAM-02 PERKIRAAN
# (Monumen Kaki Dian dan Pos 1 pendakian tidak ada di OSM). facing_deg diarahkan ke Puncak Klabat.
# facing_deg: arah hadap kamera (0 = utara, 90 = timur).
# mode: live (webcam/video/stream, default) atau foto (foto terbaru di sebuah folder).
cameras:
  - id: CAM-01
    name: "Monumen Kaki Dian (Airmadidi)"
    source: 0                          # webcam laptop
    lat: 1.4205
    lon: 124.9850
    facing_deg: 55
  - id: CAM-02
    name: "Jalur Pendakian Klabat - Pos 1"
    source: "data/videos/cam02.mp4"
    lat: 1.4420
    lon: 125.0050
    facing_deg: 67
  - id: CAM-03
    name: "Desa Tatelu"
    source: "data/videos/cam03.mp4"
    lat: 1.52690
    lon: 124.99247
    facing_deg: 152
  - id: CAM-04
    name: "Matungkas - Laikit"
    # Kamera Foto: menampilkan foto terbaru di folder ini. Saat demo, seret foto ke folder.
    source: "data/demo/CAM-04"
    mode: foto
    lat: 1.48209
    lon: 124.97276
    facing_deg: 116
