# nginx vhost for MataKlabat behind Cloudflare (Tunnel or proxied DNS) terminating HTTPS.
# Copy to /etc/nginx/conf.d/mataklabat.conf, replace DOMAIN and the port if WEB_PORT differs.
# See docs/DEPLOY.md.

# At most 10 login attempts per minute per client, on top of the app's own lockout.
limit_req_zone $binary_remote_addr zone=mataklabat_login:1m rate=10r/m;

log_format mataklabat_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    access_log /var/log/nginx/mataklabat-access.log mataklabat_safe;
    error_log /var/log/nginx/mataklabat-error.log warn;
    client_max_body_size 64k;

    # Cloudflare sets X-Forwarded-Proto; plain-HTTP visitors are sent to HTTPS.
    if ($http_x_forwarded_proto != "https") {
        return 308 https://DOMAIN$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host DOMAIN;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    location = /api/login {
        limit_req zone=mataklabat_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host DOMAIN;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_redirect off;
    }

    # Live updates (Server-Sent Events): no buffering, long-lived connection.
    location = /api/stream {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host DOMAIN;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
